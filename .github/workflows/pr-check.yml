# Compiles and unit-tests every pull request (Codex opens them from codex/* branches into dev and may not be able
# to build locally: Fabric's maven and Mojang's hosts are often unreachable from cloud sandboxes).
name: PR check

on:
  pull_request:
    branches: [main, dev]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            mod/*.gradle*
            mod/gradle.properties
            mod/gradle/wrapper/gradle-wrapper.properties
      - name: Unit tests
        working-directory: mod
        # The in-game test code compiles here too.
        run: chmod +x gradlew && ./gradlew test compileGametestJava --console=plain
      - name: Loop self-tests
        # The learning loop's Python (scripts/loop): a broken race rule costs a night of generations.
        run: |
          pip install -q numpy
          for t in scripts/loop/test_*.py; do python3 "$t" || exit 1; done
