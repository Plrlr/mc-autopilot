# Parallel trial runs of the autopilot on GitHub's free Linux machines.
# Each run gets its own machine: a fresh survival world (or a staged scenario) is played by the
# free rules brain for N game minutes; the decision log, screenshots and summary are uploaded.
# The last job commits the batch summary and decision logs to the trial-results branch
# (runs/<run id>/summary.md), readable with a plain `git fetch origin trial-results`.
# Normally started by scripts/cycle (push, run, wait, download, summarize). By hand:
#   gh workflow run trials.yml -f seeds='["a","b"]' -f extra='[{"seed":"a","scenario":"cast"}]'
# Quick single-fix test (one skill, given items, stops when the skill ends):
#   -f seeds='[]' -f extra='[{"seed":"a","id":"furnace","task":"craft furnace:1","give":"cobblestone 8,crafting_table","minutes":"3"}]'
name: Trial runs

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: 'World seeds as a JSON list; one machine per seed ([] for extra runs only)'
        default: '["a","b","c","d","e","f","g","h"]'
      minutes:
        description: 'Game minutes per run'
        default: '20'
      scenario:
        description: 'Scenario for the seeds: natural, portal, cast, stronghold or end'
        default: 'natural'
      extra:
        description: 'Extra runs as JSON: [{"seed","scenario","task","give","minutes","id","lean","perf_mods"}]'
        default: '[]'
      lean:
        description: 'Less drawing (fast graphics, no clouds/particles/sound): true or false'
        default: 'false'
      perf_mods:
        description: 'Speed-up mods, e.g. lithium,ferritecore or lithium,ferritecore,sodium'
        default: ''

jobs:
  # Turns the inputs into one list of runs (seeds x scenario, plus the extra runs).
  plan:
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - id: plan
        env:
          SEEDS: ${{ inputs.seeds }}
          SCENARIO: ${{ inputs.scenario }}
          EXTRA: ${{ inputs.extra }}
        run: |
          runs=$(jq -cn --argjson seeds "$SEEDS" --arg sc "$SCENARIO" --argjson extra "$EXTRA" '
            [$seeds[] | {seed: ., scenario: $sc}] + $extra
            | map({seed, scenario: (.scenario // "natural"), task: (.task // ""), give: (.give // ""),
                   minutes: ((.minutes // "") | tostring), id: (.id // ""), lean: (.lean // ""), perf_mods: (.perf_mods // "")}
                  | .name = (.scenario + "-" + .seed + (if .id != "" then "-" + .id else "" end)))')
          echo "runs=$runs" | tee -a "$GITHUB_OUTPUT"

  # The unit tests (gradlew test) on every batch, so a code change is checked before its trial
  # results are read.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          # Gradle and Loom's Minecraft downloads (~460 MB) come from this cache; include the
          # version file so a new Minecraft/Loom version makes a fresh cache instead of a stale one.
          cache-dependency-path: |
            mod/*.gradle*
            mod/gradle.properties
            mod/gradle/wrapper/gradle-wrapper.properties
      - name: Unit tests
        working-directory: mod
        # The in-game test code compiles here too, so a typo fails in a minute, not after a trial.
        run: chmod +x gradlew && ./gradlew test compileGametestJava --console=plain

  trial:
    needs: plan
    if: needs.plan.outputs.runs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/play
        with:
          name: ${{ matrix.name }}
          seed: ${{ matrix.seed }}
          minutes: ${{ matrix.minutes || inputs.minutes }}
          scenario: ${{ matrix.scenario }}
          task: ${{ matrix.task }}
          give: ${{ matrix.give }}
          lean: ${{ matrix.lean || inputs.lean }}
          perf_mods: ${{ matrix.perf_mods || inputs.perf_mods }}

  # Summarizes the batch here and commits the summary and the small logs to the trial-results
  # branch (runs/<run id>/). Some Claude sessions can't download artifacts (their network blocks
  # the blob storage artifacts are served from) but can always git fetch.
  summarize:
    needs: [plan, trial]
    if: always() && needs.plan.outputs.runs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: trial-*
          path: batch
      - name: Summarize
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          python3 scripts/summarize_batch batch --run "${{ github.run_id }}" --commit "${GITHUB_SHA:0:7}" \
            --minutes "$MINUTES" --line-out line.txt > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit to trial-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEEDS: ${{ inputs.seeds }}
          SCENARIO: ${{ inputs.scenario }}
          EXTRA: ${{ inputs.extra }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd "$RUNNER_TEMP"
          if git ls-remote --exit-code --heads "$url" trial-results >/dev/null; then
            git clone -q --depth 1 --branch trial-results "$url" results
          else
            git init -q -b trial-results results && git -C results remote add origin "$url"
          fi
          cd results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          d="runs/${GITHUB_RUN_ID}"
          mkdir -p "$d"
          cp "$GITHUB_WORKSPACE/summary.md" "$GITHUB_WORKSPACE/line.txt" "$d/"
          # The decision logs and test reports (small); trial.log and screenshots stay artifacts.
          for a in "$GITHUB_WORKSPACE"/batch/*/; do
            n=$(basename "$a"); mkdir -p "$d/$n"
            cp "$a/autopilot-test.log" "$d/$n/" 2>/dev/null || true
            cp "$a"/build/run/clientGameTest/mc-autopilot/logs/*.jsonl "$d/$n/" 2>/dev/null || true
          done
          printf 'run %s\nbranch %s\ncommit %s\nseeds %s\nscenario %s\nminutes %s\nextra %s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$SEEDS" "$SCENARIO" "$MINUTES" "$EXTRA" > "$d/run.txt"
          git add runs
          git commit -q -m "Batch $GITHUB_RUN_ID on $GITHUB_REF_NAME @ ${GITHUB_SHA:0:7}"
          # Parallel batches may push at the same moment: rebase and retry.
          for i in 1 2 3 4 5; do
            git push -q origin trial-results && exit 0
            sleep $((i * 5)); git pull -q --rebase origin trial-results || true
          done
          exit 1
