# The learning loop, unattended: each run of this workflow is one generation.
#   propose: read loop/state.json from the trial-results branch, pick the champion, the
#            challengers still racing and new mutants, and fresh random seeds (scripts/loop/loop.py)
#   trial:   play every (genome, seed) pair on its own machine, lean drawing, 20 game minutes
#   update:  score the runs, race the challengers, retrain the learned brain, write the history
#            and the dashboard to trial-results, then start the next generation
# Start:  gh workflow run loop.yml            (runs until the daily cap in loop/state.json)
#         gh workflow run loop.yml -f generations=3
# Stop:   put a file named STOP in loop/ on the trial-results branch (scripts/loop/stop), or
#         disable the workflow in the Actions tab. The hourly schedule restarts a chain that broke
#         (a cancelled run); it does nothing while a generation is running.
name: Learning loop

on:
  workflow_dispatch:
    inputs:
      generations:
        description: 'Generations to run, then stop (0 = keep going until the daily cap or loop/STOP)'
        default: '0'
      smoke:
        description: 'Plumbing test: one tiny generation (2 game minutes) in loop-smoke/, no next generation'
        default: 'false'
      recover_run:
        description: 'Score the pending generation from this completed/cancelled workflow run without replaying games'
        default: ''
  schedule:
    - cron: '23 * * * *'

# One generation at a time. A second start waits (at most one waits; a newer one replaces it).
concurrency:
  group: learning-loop
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      runs: ${{ steps.p.outputs.runs }}
      gen: ${{ steps.p.outputs.gen }}
      results: ${{ steps.p.outputs.results }}
      state: ${{ steps.p.outputs.state }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SMOKE: ${{ inputs.smoke || 'false' }}
          RECOVER_RUN: ${{ inputs.recover_run || '' }}
        run: |
          echo "runs=[]" >> "$GITHUB_OUTPUT"
          scripts/loop/results.sh checkout results
          if [ -n "$RECOVER_RUN" ]; then
            python3 scripts/loop/recover.py --state results/loop --run "$RECOVER_RUN" --out runs.json
            echo 'runs=[{"name":"recover-existing-artifacts"}]' >> "$GITHUB_OUTPUT"
            echo "gen=$(jq -r .gen runs.json)" >> "$GITHUB_OUTPUT"
            echo "state=loop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only actual generations count as activity. A skipped hourly run must not keep a
          # broken chain alive forever. Concurrency ensures no other generation is running here.
          if [ "$EVENT" = "schedule" ] && python3 scripts/loop/restart.py results/loop; then
            echo "The loop played recently; the schedule has nothing to restart."; exit 0
          fi
          state=loop; override=""
          if [ "$SMOKE" = "true" ]; then
            state=loop-smoke; override='{"minutes":2,"seeds_per_gen":1,"max_genomes":2,"data_runs":1}'
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          mkdir -p "results/$state"
          python3 scripts/loop/loop.py propose --state "results/$state" --sha "$GITHUB_SHA" --out runs.json --override "$override"
          runs=$(jq -c .runs runs.json)
          [ "$runs" = "[]" ] && exit 0
          scripts/loop/results.sh commit results "Loop generation $(jq -r .gen runs.json): proposed"
          echo "runs=$runs" >> "$GITHUB_OUTPUT"
          echo "gen=$(jq -r .gen runs.json)" >> "$GITHUB_OUTPUT"
          echo "results=$(git -C results rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  trial:
    needs: propose
    if: needs.propose.outputs.runs != '[]' && inputs.recover_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.propose.outputs.runs) }}
    steps:
      # A genome with a code change (Level 2) plays its own commit; the rest play this generation's main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - name: Genes and the learned model
        env:
          PARAMS: ${{ matrix.params }}
          RESULTS: ${{ needs.propose.outputs.results }}
        run: |
          printf '%s' "$PARAMS" > "$RUNNER_TEMP/params.json"
          git fetch -q --depth 1 origin "$RESULTS"
          git show FETCH_HEAD:loop/learned.json > "$RUNNER_TEMP/learned.json" 2>/dev/null || rm -f "$RUNNER_TEMP/learned.json"
          echo "PARAMS_FILE=$RUNNER_TEMP/params.json" >> "$GITHUB_ENV"
          echo "LEARNED_FILE=$([ -f "$RUNNER_TEMP/learned.json" ] && echo "$RUNNER_TEMP/learned.json")" >> "$GITHUB_ENV"
      - uses: ./.github/actions/play
        with:
          name: ${{ matrix.name }}
          seed: ${{ matrix.seed }}
          minutes: ${{ matrix.minutes }}
          scenario: ${{ matrix.scenario }}
          params: ${{ env.PARAMS_FILE }}
          learned: ${{ env.LEARNED_FILE }}
          lean: ${{ matrix.lean }}
          perf_mods: ${{ matrix.perf_mods }}
          window: ${{ matrix.window }}
          start: ${{ matrix.start }}
          token: ${{ github.token }}
          retention: '5'

  update:
    needs: [propose, trial]
    if: always() && needs.propose.outputs.runs != '[]' && needs.propose.outputs.runs != ''
    runs-on: ubuntu-latest
    # Scoring and training take ~15 minutes; level 3 (evolve.py) gets up to 35 of the rest.
    timeout-minutes: 60
    env:
      STATE: ${{ needs.propose.outputs.state }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.recover_run || github.run_id }}
          github-token: ${{ github.token }}
          pattern: trial-*
          path: batch
      - name: Score, race, learn
        env:
          GH_TOKEN: ${{ github.token }}  # uploads new checkpoints to the checkpoints release
        run: |
          pip install -q numpy || true
          scripts/loop/results.sh checkout results
          python3 scripts/loop/loop.py update --state "results/$STATE" --batch batch
          python3 scripts/loop/train.py --state "results/$STATE"
      - name: Merge a winning code change into main
        run: python3 scripts/loop/loop.py merge --state "results/$STATE"
      # Published before level 3: a timeout there must not lose the generation's scores.
      - name: Publish
        run: |
          python3 scripts/loop/loop.py status --state "results/$STATE" | tee -a "$GITHUB_STEP_SUMMARY"
          # The dashboard lives next to its data (GitHub Pages serves the trial-results branch).
          cp scripts/loop/dashboard.html results/index.html
          touch results/.nojekyll
          scripts/loop/results.sh commit results "Loop generation ${{ needs.propose.outputs.gen }}: scored"
      # Level 3 (code changes by Claude) runs only when this secret exists: see docs/learning-loop.md.
      # Checked in a step: a secrets comparison in the job's env came out false with the secret set.
      - name: Is level 3 on?
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$T" ]; then echo "HAS_CLAUDE=true" >> "$GITHUB_ENV"; fi
          echo "level 3: $([ -n "$T" ] && echo on || echo off)"
      - uses: actions/setup-java@v6
        if: env.HAS_CLAUDE == 'true'
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            mod/*.gradle*
            mod/gradle.properties
            mod/gradle/wrapper/gradle-wrapper.properties
      - name: Claude writes a code change (when the gene search has stalled)
        if: env.HAS_CLAUDE == 'true'
        # A hang here must not break the chain: the next generation is still started below.
        timeout-minutes: 38
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}  # a new skill's drill is started on trials.yml
        run: |
          git fetch -q origin main && git checkout -q --detach FETCH_HEAD
          curl -fsSL https://claude.ai/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          chmod +x mod/gradlew
          python3 scripts/loop/evolve.py --state "results/$STATE" --batch batch || echo "evolve step failed; the loop goes on"
      - name: Save level 3's result
        if: env.HAS_CLAUDE == 'true'
        run: |
          scripts/loop/results.sh commit results "Loop generation ${{ needs.propose.outputs.gen }}: level 3"
      - name: Next generation
        env:
          GH_TOKEN: ${{ github.token }}
          LEFT: ${{ inputs.generations || '0' }}
        run: |
          if [ "${{ inputs.smoke }}" = "true" ]; then echo "Smoke test: no next generation."; exit 0; fi
          if [ "$LEFT" = "1" ]; then echo "Last requested generation done."; exit 0; fi
          next=$(( LEFT > 1 ? LEFT - 1 : 0 ))
          gh workflow run loop.yml --ref main -f generations="$next"
